name: Test Script Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install google-genai
        run: pip install google-genai

      - name: Run script.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python script.py

      - name: Save daily scripts folder to repo
        run: |
          git config user.name "yt-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/
          git commit -m "Add daily script package" || echo "No changes"
          git push
          
