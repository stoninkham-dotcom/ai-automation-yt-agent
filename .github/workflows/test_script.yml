name: Test Script Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-genai edge-tts

      - name: Run script.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python script.py

      - name: Run 02_voice.py
        run: python 02_voice.py

      - name: Run 03_video.py
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python 03_video.py

      - name: Run 04_edit.py
        run: python 04_edit.py

      - name: Save daily scripts and voiceover to repo
        run: |
          git config user.name "yt-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add scripts/
          git commit -m "Add daily script and voiceover" || echo "No changes"
          git push
          
